<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardSort Rush — Numbered Card Sorting Game</title>
  <style>
    :root {
      --bg-outer: #060911;
      --bg-frame: #0f172a;
      --bg-panel: #162033;
      --bg-card: #1e293b;
      --bg-card-hover: #27354d;
      --border: #2b3b55;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --combo: #c084fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-outer);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* Compact Fixed-Frame Game Window */
    .game-frame {
      width: 100%;
      max-width: 820px;
      height: 590px;
      background: var(--bg-frame);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Top Header */
    .frame-header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 0.7rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .brand span { color: var(--accent); }

    .level-pill {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--accent);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    button {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid #384a68;
      border-radius: 7px;
      padding: 0.36rem 0.65rem;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.12s ease;
      user-select: none;
    }

    button:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--bg-card-hover);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--accent);
      color: #060911;
      border-color: var(--accent);
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent-dark);
      color: #fff;
    }

    button.danger {
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.45);
    }

    button.danger:hover:not(:disabled) {
      background: var(--danger);
      color: #fff;
    }

    button.active {
      background: rgba(56, 189, 248, 0.16);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* HUD Telemetry Strip */
    .hud-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(6, 9, 17, 0.45);
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 0.9rem;
      gap: 0.5rem;
      text-align: center;
    }

    .hud-cell span {
      display: block;
      font-size: 0.64rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .hud-cell strong {
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }

    .hud-cell strong.good { color: var(--success); }
    .hud-cell strong.warn { color: var(--warning); }
    .hud-cell strong.bad { color: var(--danger); }
    .hud-cell strong.combo { color: var(--combo); }

    /* Rule / Modifier Banner */
    .modifier-bar {
      background: rgba(56, 189, 248, 0.07);
      border-bottom: 1px solid rgba(56, 189, 248, 0.18);
      padding: 0.45rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #bae6fd;
      gap: 0.5rem;
    }

    .modifier-tag {
      font-weight: 700;
      color: var(--warning);
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
    }

    /* Card Table Arena */
    .arena {
      flex: 1;
      padding: 1rem 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      background: radial-gradient(circle at 50% 45%, rgba(56, 189, 248, 0.06), transparent 72%);
      position: relative;
      overflow-y: auto;
    }

    .cards-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.65rem;
      width: 100%;
      max-width: 720px;
    }

    /* Equal-Height Playing Cards (NO height clue!) */
    .num-card {
      width: 82px;
      height: 112px;
      background: linear-gradient(160deg, #1e293b 0%, #131c2e 100%);
      border: 2px solid #364866;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem;
      cursor: pointer;
      position: relative;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
      user-select: none;
    }

    .num-card.compact {
      width: 68px;
      height: 94px;
      border-radius: 10px;
    }

    .num-card.mini {
      width: 58px;
      height: 80px;
      border-radius: 8px;
      padding: 0.3rem;
    }

    .num-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 12px 22px rgba(56, 189, 248, 0.2);
    }

    .num-card.selected {
      transform: translateY(-7px) scale(1.04);
      border-color: #ffffff;
      background: linear-gradient(160deg, #2563eb 0%, #1d4ed8 100%);
      box-shadow: 0 14px 28px rgba(56, 189, 248, 0.45);
      z-index: 3;
    }

    .num-card.in-place {
      border-color: rgba(16, 185, 129, 0.65);
      background: linear-gradient(160deg, #13382e 0%, #0f2922 100%);
    }

    .num-card.hint-glow {
      border-color: var(--warning);
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.55);
      transform: translateY(-4px);
    }

    .num-card.swap-good {
      border-color: var(--success);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
    }

    .num-card.swap-bad {
      border-color: var(--danger);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
      animation: shake 0.24s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .card-corner {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .card-value {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      text-align: center;
      line-height: 1.1;
    }

    .num-card.compact .card-value { font-size: 1.3rem; }
    .num-card.mini .card-value { font-size: 1.08rem; }

    .card-slot {
      font-size: 0.62rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .num-card.in-place .card-slot {
      color: #6ee7b7;
    }

    /* Footer Controls */
    .frame-footer {
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      font-size: 0.74rem;
      color: var(--text-secondary);
    }

    .powerups {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .xp-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .xp-bar {
      width: 110px;
      height: 7px;
      background: #090e1a;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .xp-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--combo));
      transition: width 0.25s ease;
    }

    /* Overlay Modal inside Frame */
    .frame-modal {
      position: absolute;
      inset: 0;
      background: rgba(6, 9, 17, 0.86);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      z-index: 20;
    }

    .frame-modal.visible { display: flex; }

    .modal-box {
      background: var(--bg-panel);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 1.35rem;
      width: 100%;
      max-width: 390px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    .modal-box h2 {
      font-size: 1.3rem;
      margin-bottom: 0.35rem;
    }

    .modal-box p {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
      line-height: 1.45;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1.1rem;
      text-align: left;
    }

    .modal-stat {
      background: var(--bg-frame);
      border: 1px solid var(--border);
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
    }

    .modal-stat span {
      display: block;
      font-size: 0.65rem;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .modal-stat strong {
      font-size: 0.95rem;
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <div class="game-frame">
    <!-- Top Header -->
    <header class="frame-header">
      <div class="brand">
        🃏 Card<span>Sort</span> Rush
        <span class="level-pill" id="levelBadge">Level 1 · Rookie</span>
      </div>

      <div class="header-actions">
        <button id="soundBtn" class="active" title="Toggle Sound (M)">🔊 Sound</button>
        <button id="restartLevelBtn" title="Restart Current Level (R)">↻ Retry</button>
        <button id="newRunBtn" class="danger" title="Reset to Level 1">Reset Run</button>
      </div>
    </header>

    <!-- HUD Telemetry -->
    <div class="hud-bar">
      <div class="hud-cell"><span>Score</span><strong id="hudScore" class="good">0</strong></div>
      <div class="hud-cell"><span>Best</span><strong id="hudBest">0</strong></div>
      <div class="hud-cell"><span>Combo</span><strong id="hudCombo" class="combo">1.0x</strong></div>
      <div class="hud-cell"><span>Swaps / Par</span><strong id="hudMoves">0 / 0</strong></div>
      <div class="hud-cell"><span>Timer</span><strong id="hudTimer">30.0s</strong></div>
    </div>

    <!-- Level Objective & Modifier Banner -->
    <div class="modifier-bar">
      <span id="objectiveText">Sort cards <strong>Low → High</strong> (left to right) by reading the numbers!</span>
      <span class="modifier-tag" id="modifierTag">Standard Deck</span>
    </div>

    <!-- Main Card Arena -->
    <main class="arena">
      <div class="cards-grid" id="cardsGrid"></div>
    </main>

    <!-- Bottom Powerups & Level XP -->
    <footer class="frame-footer">
      <div class="powerups">
        <button id="hintBtn" title="Highlight a valid swap (-75 pts, Shortcut: H)">💡 Hint (-75)</button>
        <button id="timeFreezeBtn" title="Add +8 seconds (-100 pts, Shortcut: T)">❄️ +8s Time (-100)</button>
        <button id="peekGreenBtn" class="active" title="Toggle green border on cards already in their exact final slot">👁 Slot Check: ON</button>
      </div>

      <div class="xp-wrap">
        <span id="xpLabel">Next: Lv 2</span>
        <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
      </div>
    </footer>

    <!-- Level Complete / Game Over Modal -->
    <div class="frame-modal" id="levelModal">
      <div class="modal-box">
        <h2 id="modalTitle">Level Cleared!</h2>
        <p id="modalDesc">Sharp number reading and clean swaps.</p>
        <div class="modal-grid">
          <div class="modal-stat"><span>Points Earned</span><strong id="mPoints">+0</strong></div>
          <div class="modal-stat"><span>Swaps vs Par</span><strong id="mSwaps">0 / 0</strong></div>
          <div class="modal-stat"><span>Time Remaining</span><strong id="mTime">0.0s</strong></div>
          <div class="modal-stat"><span>Max Combo</span><strong id="mCombo">1.0x</strong></div>
        </div>
        <div style="display: flex; gap: 0.6rem; justify-content: center;">
          <button id="modalReplayBtn">↻ Replay Level</button>
          <button id="modalNextBtn" class="primary">Level 2 →</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /**
     * Level Progression Definitions
     * Every card is identical in physical size—players must read the numbers!
     */
    const LEVEL_CONFIGS = [
      { level: 1,  title: "Rookie",       count: 6,  min: 1,   max: 50,   order: "asc",  negatives: false, decimals: false, time: 28, tag: "2-Digit Deck" },
      { level: 2,  title: "Dealer",       count: 8,  min: 10,  max: 99,   order: "asc",  negatives: false, decimals: false, time: 34, tag: "Standard Deck" },
      { level: 3,  title: "Shuffler",     count: 9,  min: 100, max: 999,  order: "asc",  negatives: false, decimals: false, time: 40, tag: "3-Digit Numbers" },
      { level: 4,  title: "Flipside",     count: 9,  min: 10,  max: 99,   order: "desc", negatives: false, decimals: false, time: 38, tag: "High → Low!" },
      { level: 5,  title: "Sub-Zero",     count: 10, min: -50, max: 50,   order: "asc",  negatives: true,  decimals: false, time: 44, tag: "Negative Numbers" },
      { level: 6,  title: "Precision",    count: 10, min: 1,   max: 25,   order: "asc",  negatives: false, decimals: true,  time: 46, tag: "Decimals (0.1)" },
      { level: 7,  title: "Close Calls",  count: 12, min: 400, max: 499,  order: "asc",  negatives: false, decimals: false, time: 52, tag: "Tight 400s Range" },
      { level: 8,  title: "Reverse Sub",  count: 12, min: -99, max: 99,   order: "desc", negatives: true,  decimals: false, time: 54, tag: "High → Low + Negatives" },
      { level: 9,  title: "Quant",        count: 14, min: -20, max: 20,   order: "asc",  negatives: true,  decimals: true,  time: 60, tag: "Signed Decimals" },
      { level: 10, title: "Grandmaster",  count: 16, min: 100, max: 999,  order: "asc",  negatives: false, decimals: false, time: 68, tag: "16-Card Gauntlet" }
    ];

    function getLevelSpec(lvl) {
      if (lvl <= LEVEL_CONFIGS.length) return LEVEL_CONFIGS[lvl - 1];
      const extra = lvl - LEVEL_CONFIGS.length;
      return {
        level: lvl,
        title: `Master +${extra}`,
        count: Math.min(20, 16 + Math.floor(extra / 2)),
        min: -99,
        max: 999,
        order: lvl % 2 === 0 ? "desc" : "asc",
        negatives: true,
        decimals: lvl % 3 === 0,
        time: Math.min(85, 68 + extra * 2),
        tag: lvl % 2 === 0 ? "Endless High → Low" : "Endless Low → High"
      };
    }

    /**
     * Web Audio Sound Synthesizer
     */
    class CardAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      unlock() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }

      tone(freq, duration = 0.08, type = 'triangle', gainVal = 0.16) {
        if (!this.enabled) return;
        this.unlock();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(gainVal, now + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.01);
      }

      selectCard() { this.tone(520, 0.06, 'sine', 0.14); }
      goodSwap(combo) {
        const pitch = Math.min(980, 440 + combo * 55);
        this.tone(pitch, 0.11, 'triangle', 0.18);
      }
      badSwap() {
        this.tone(155, 0.14, 'sawtooth', 0.15);
      }
      powerup() {
        this.tone(660, 0.08, 'sine', 0.15);
        setTimeout(() => this.tone(880, 0.12, 'sine', 0.15), 65);
      }
      levelClear() {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
          setTimeout(() => this.tone(f, 0.22, 'triangle', 0.18), idx * 65);
        });
      }
    }

    /**
     * Exact Minimum Swaps via Permutation Cycle Decomposition
     */
    function computeParSwaps(current, target) {
      const n = current.length;
      const used = new Array(n).fill(false);
      const targetIndices = current.map((val) => {
        for (let i = 0; i < n; i++) {
          if (!used[i] && target[i] === val) {
            used[i] = true;
            return i;
          }
        }
        return 0;
      });

      const visited = new Array(n).fill(false);
      let swaps = 0;
      for (let i = 0; i < n; i++) {
        if (visited[i] || targetIndices[i] === i) continue;
        let cycle = 0;
        let cur = i;
        while (!visited[cur]) {
          visited[cur] = true;
          cur = targetIndices[cur];
          cycle++;
        }
        if (cycle > 1) swaps += cycle - 1;
      }
      return Math.max(1, swaps);
    }

    /**
     * Game State
     */
    const state = {
      level: 1,
      score: 0,
      bestScore: Number(localStorage.getItem('cardsort_best') || 0),
      combo: 1.0,
      maxCombo: 1.0,
      showSlotCheck: true,

      spec: null,
      deck: [],
      targetDeck: [],
      selectedIdx: null,
      moves: 0,
      parSwaps: 0,
      timeLeft: 30,
      timerId: null,
      roundOver: false,

      flashGood: [],
      flashBad: [],
      hintPair: []
    };

    const audio = new CardAudio();

    const dom = {
      levelBadge: document.getElementById('levelBadge'),
      soundBtn: document.getElementById('soundBtn'),
      restartLevelBtn: document.getElementById('restartLevelBtn'),
      newRunBtn: document.getElementById('newRunBtn'),
      hudScore: document.getElementById('hudScore'),
      hudBest: document.getElementById('hudBest'),
      hudCombo: document.getElementById('hudCombo'),
      hudMoves: document.getElementById('hudMoves'),
      hudTimer: document.getElementById('hudTimer'),
      objectiveText: document.getElementById('objectiveText'),
      modifierTag: document.getElementById('modifierTag'),
      cardsGrid: document.getElementById('cardsGrid'),
      hintBtn: document.getElementById('hintBtn'),
      timeFreezeBtn: document.getElementById('timeFreezeBtn'),
      peekGreenBtn: document.getElementById('peekGreenBtn'),
      xpLabel: document.getElementById('xpLabel'),
      xpFill: document.getElementById('xpFill'),
      levelModal: document.getElementById('levelModal'),
      modalTitle: document.getElementById('modalTitle'),
      modalDesc: document.getElementById('modalDesc'),
      mPoints: document.getElementById('mPoints'),
      mSwaps: document.getElementById('mSwaps'),
      mTime: document.getElementById('mTime'),
      mCombo: document.getElementById('mCombo'),
      modalReplayBtn: document.getElementById('modalReplayBtn'),
      modalNextBtn: document.getElementById('modalNextBtn')
    };

    /**
     * Deck Generation & Level Setup
     */
    function buildDeck(spec) {
      const set = new Set();
      let guard = 0;
      while (set.size < spec.count && guard < 2000) {
        guard++;
        let raw = Math.random() * (spec.max - spec.min) + spec.min;
        let val = spec.decimals ? Math.round(raw * 10) / 10 : Math.round(raw);
        if (Object.is(val, -0)) val = 0;
        set.add(val);
      }

      const sorted = [...set].sort((a, b) => spec.order === 'asc' ? a - b : b - a);
      const shuffled = [...sorted];

      // Ensure deck is never already solved on deal
      do {
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
      } while (shuffled.every((v, idx) => v === sorted[idx]));

      return { shuffled, sorted };
    }

    function startLevel(lvl) {
      clearInterval(state.timerId);
      dom.levelModal.classList.remove('visible');

      state.level = lvl;
      state.spec = getLevelSpec(lvl);
      const { shuffled, sorted } = buildDeck(state.spec);

      state.deck = shuffled;
      state.targetDeck = sorted;
      state.selectedIdx = null;
      state.moves = 0;
      state.parSwaps = computeParSwaps(state.deck, state.targetDeck);
      state.timeLeft = state.spec.time;
      state.roundOver = false;
      state.combo = 1.0;
      state.maxCombo = 1.0;
      state.flashGood = [];
      state.flashBad = [];
      state.hintPair = [];

      updateHeaderAndBanner();
      updateHUD();
      renderCards();

      let last = performance.now();
      state.timerId = setInterval(() => {
        if (state.roundOver) return;
        const now = performance.now();
        const dt = (now - last) / 1000;
        last = now;
        state.timeLeft = Math.max(0, state.timeLeft - dt);
        updateHUD();

        if (state.timeLeft <= 0) {
          handleTimeOut();
        }
      }, 100);
    }

    function updateHeaderAndBanner() {
      const s = state.spec;
      dom.levelBadge.textContent = `Level ${s.level} · ${s.title}`;
      dom.modifierTag.textContent = `${s.count} Cards · ${s.tag}`;
      dom.objectiveText.innerHTML = s.order === 'asc'
        ? `Sort cards <strong>LOW → HIGH</strong> (left to right) by reading the numbers.`
        : `Sort cards <strong>HIGH → LOW</strong> (left to right) by reading the numbers!`;

      dom.xpLabel.textContent = `Next: Lv ${s.level + 1}`;
      const progress = Math.min(100, ((s.level - 1) % 10) * 10 + 10);
      dom.xpFill.style.width = `${progress}%`;
    }

    function updateHUD() {
      dom.hudScore.textContent = state.score.toLocaleString();
      dom.hudBest.textContent = state.bestScore.toLocaleString();
      dom.hudCombo.textContent = `${state.combo.toFixed(1)}x`;
      dom.hudMoves.textContent = `${state.moves} / ${state.parSwaps}`;
      dom.hudMoves.className = state.moves <= state.parSwaps ? 'good' : 'warn';

      dom.hudTimer.textContent = `${state.timeLeft.toFixed(1)}s`;
      dom.hudTimer.className = state.timeLeft < 6 ? 'bad' : state.timeLeft < 12 ? 'warn' : '';
    }

    function formatCardNumber(num) {
      return state.spec.decimals ? num.toFixed(1) : String(num);
    }

    /**
     * Render Equal-Height Playing Cards (Zero visual height clue)
     */
    function renderCards() {
      const count = state.deck.length;
      const sizeClass = count >= 15 ? 'mini' : count >= 11 ? 'compact' : '';
      dom.cardsGrid.innerHTML = '';

      state.deck.forEach((val, idx) => {
        const card = document.createElement('div');
        card.className = `num-card ${sizeClass}`;

        const isCorrectSlot = val === state.targetDeck[idx];
        if (state.showSlotCheck && isCorrectSlot) card.classList.add('in-place');
        if (state.selectedIdx === idx) card.classList.add('selected');
        if (state.hintPair.includes(idx)) card.classList.add('hint-glow');
        if (state.flashGood.includes(idx)) card.classList.add('swap-good');
        if (state.flashBad.includes(idx)) card.classList.add('swap-bad');

        const displayNum = formatCardNumber(val);

        card.innerHTML = `
          <div class="card-corner">
            <span>${displayNum}</span>
            <span>#${idx + 1}</span>
          </div>
          <div class="card-value">${displayNum}</div>
          <div class="card-slot">${state.showSlotCheck && isCorrectSlot ? 'LOCKED' : `SLOT ${idx + 1}`}</div>
        `;

        card.addEventListener('click', () => handleCardClick(idx));
        dom.cardsGrid.appendChild(card);
      });
    }

    /**
     * Card Selection & Swap Logic
     */
    function handleCardClick(idx) {
      if (state.roundOver) return;
      audio.unlock();

      if (state.selectedIdx === null) {
        state.selectedIdx = idx;
        state.hintPair = [];
        audio.selectCard();
        renderCards();
        return;
      }

      if (state.selectedIdx === idx) {
        state.selectedIdx = null;
        renderCards();
        return;
      }

      const i = state.selectedIdx;
      const j = idx;
      state.selectedIdx = null;
      state.moves++;

      const beforePlaced =
        (state.deck[i] === state.targetDeck[i] ? 1 : 0) +
        (state.deck[j] === state.targetDeck[j] ? 1 : 0);

      [state.deck[i], state.deck[j]] = [state.deck[j], state.deck[i]];

      const afterPlaced =
        (state.deck[i] === state.targetDeck[i] ? 1 : 0) +
        (state.deck[j] === state.targetDeck[j] ? 1 : 0);

      if (afterPlaced > beforePlaced) {
        state.combo = Math.min(5.0, +(state.combo + 0.2).toFixed(1));
        state.maxCombo = Math.max(state.maxCombo, state.combo);
        state.flashGood = [i, j];
        state.flashBad = [];
        audio.goodSwap(state.combo);
      } else {
        state.combo = 1.0;
        state.flashBad = [i, j];
        state.flashGood = [];
        audio.badSwap();
      }

      updateHUD();
      renderCards();

      setTimeout(() => {
        state.flashGood = [];
        state.flashBad = [];
        if (!state.roundOver) renderCards();
      }, 220);

      if (state.deck.every((val, k) => val === state.targetDeck[k])) {
        handleLevelWin();
      }
    }

    function addPoints(delta) {
      state.score = Math.max(0, state.score + delta);
      if (state.score > state.bestScore) {
        state.bestScore = state.score;
        localStorage.setItem('cardsort_best', String(state.bestScore));
      }
      updateHUD();
    }

    function handleLevelWin() {
      state.roundOver = true;
      clearInterval(state.timerId);
      audio.levelClear();

      const base = 200 * state.level;
      const parBonus = state.moves <= state.parSwaps ? 150 + (state.parSwaps - state.moves) * 35 : 0;
      const timeBonus = Math.round(state.timeLeft * 10);
      const earned = Math.round((base + parBonus + timeBonus) * state.maxCombo);

      addPoints(earned);

      dom.modalTitle.textContent = `Level ${state.level} Cleared!`;
      dom.modalTitle.style.color = 'var(--success)';
      dom.modalDesc.textContent = state.moves <= state.parSwaps
        ? "Par beaten! Optimal swap path."
        : "Deck sorted! Beat Par next level for a big multiplier.";
      dom.mPoints.textContent = `+${earned.toLocaleString()}`;
      dom.mSwaps.textContent = `${state.moves} / ${state.parSwaps}`;
      dom.mTime.textContent = `${state.timeLeft.toFixed(1)}s`;
      dom.mCombo.textContent = `${state.maxCombo.toFixed(1)}x`;
      dom.modalNextBtn.textContent = `Level ${state.level + 1} →`;
      dom.modalNextBtn.onclick = () => startLevel(state.level + 1);
      dom.levelModal.classList.add('visible');
    }

    function handleTimeOut() {
      state.roundOver = true;
      clearInterval(state.timerId);
      audio.badSwap();

      dom.modalTitle.textContent = "Time Expired!";
      dom.modalTitle.style.color = 'var(--danger)';
      dom.modalDesc.textContent = `You ran out of time on Level ${state.level}.`;
      dom.mPoints.textContent = "+0";
      dom.mSwaps.textContent = `${state.moves} / ${state.parSwaps}`;
      dom.mTime.textContent = "0.0s";
      dom.mCombo.textContent = `${state.maxCombo.toFixed(1)}x`;
      dom.modalNextBtn.textContent = "Try Again ↻";
      dom.modalNextBtn.onclick = () => startLevel(state.level);
      dom.levelModal.classList.add('visible');
    }

    /**
     * Powerups & Controls
     */
    function triggerHint() {
      if (state.roundOver) return;
      for (let i = 0; i < state.deck.length; i++) {
        if (state.deck[i] !== state.targetDeck[i]) {
          const targetIdx = state.deck.findIndex((val, idx) => idx > i && val === state.targetDeck[i]);
          if (targetIdx !== -1) {
            addPoints(-75);
            state.hintPair = [i, targetIdx];
            audio.powerup();
            renderCards();
            return;
          }
        }
      }
    }

    function triggerTimeFreeze() {
      if (state.roundOver) return;
      addPoints(-100);
      state.timeLeft += 8;
      audio.powerup();
      updateHUD();
    }

    dom.soundBtn.addEventListener('click', () => {
      audio.enabled = !audio.enabled;
      dom.soundBtn.textContent = audio.enabled ? "🔊 Sound" : "🔇 Muted";
      dom.soundBtn.classList.toggle('active', audio.enabled);
      if (audio.enabled) audio.selectCard();
    });

    dom.peekGreenBtn.addEventListener('click', () => {
      state.showSlotCheck = !state.showSlotCheck;
      dom.peekGreenBtn.textContent = state.showSlotCheck ? "👁 Slot Check: ON" : "👁 Slot Check: OFF";
      dom.peekGreenBtn.classList.toggle('active', state.showSlotCheck);
      renderCards();
    });

    dom.hintBtn.addEventListener('click', triggerHint);
    dom.timeFreezeBtn.addEventListener('click', triggerTimeFreeze);
    dom.restartLevelBtn.addEventListener('click', () => startLevel(state.level));
    dom.modalReplayBtn.addEventListener('click', () => startLevel(state.level));

    dom.newRunBtn.addEventListener('click', () => {
      state.score = 0;
      startLevel(1);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') triggerHint();
      else if (e.key === 't' || e.key === 'T') triggerTimeFreeze();
      else if (e.key === 'r' || e.key === 'R') startLevel(state.level);
      else if (e.key === 'm' || e.key === 'M') dom.soundBtn.click();
    });

    // Start Level 1
    startLevel(1);
  </script>
</body>
</html>
